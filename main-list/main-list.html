<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="This page is the anime openings main list of woodlists, uploaded by the creator of the page">
    <meta name="autor" content="José Luis Gómez">
    <meta name="title" content="Woodlists Anime Openings Main List">
    <title>Anime Openings Main List</title>
    <link rel="stylesheet" href="main-list-styles.css">
    <link rel="stylesheet" href="/fonts.css">
    <link rel="icon" href="/img/icono.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">

</head>
<body>
    <div class="modal-container">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-content" id="modalHeader">Add a video</div>
                <span class="material-symbols-outlined close-button">Close</span>
            </div>
            <div class="modal-content">
                <form class="modal-content__form">
                    <div class="form__input-container" id="modalTitle">
                        Title:
                        <input type="text" class="form__input" id="title">
                    </div>
                    <div class="form__input-container" id="modalLink">
                        Link:
                        <input type="text" class="form__input" id="link">
                    </div>
                    <div class="form__input-container" id="modalImg">
                        Img:
                        <label for="image" class="form__input-image">Select File</label>
                        <input type="file" accept="image/*" class="form__input form__input-image-hidden" id="image">
                    </div>
                    <div class="form__final-container">
                        <div class="form__input-container" id="modalPos">
                            Pos:
                            <input type="number" class="form__input-pos" id="position">
                        </div>
                        <div class="form__input-container">
                            <input type="submit" class="form__input form__input-submit" value="Add">
                        </div>
                    </div>
            

                </form>
            </div>
        </div>
        <div class="modal-message-container">
            <div class="modal-correct-message">
                <div class="modal-message-text">Upload Correctly</div>
                <span class="material-symbols-outlined close-button">Done</span>
            </div>
        </div>
    </div>
    <header class="header">
        <input type="checkbox" id="menu-toggle" class="header__checkbox">
        <label for="menu-toggle" class="header__open-nav-button" role="button">=</label>
        <a href="index.html"  class="li-item__link" id="li-item__logo-mobile" aria-label="Link that redirects to the main web">Woodlist.com</a>
        <nav class="header__content">
            <ul class="content__list">
                    <li class="list__li-item" id="li-item__logo">
                        <a href="/index/index.html"  class="li-item__link" aria-label="Link that redirects to the main web">Woodlist.com</a>
                    </li>
                    <li class="list__li-item"> 
                        <a href="/user-area/user-area.html" class="li-item__link" aria-label="Link that redirects to user area" id="userArea">Woodlists User Area</a>
                    </li>
                    <li class="list__li-item">
                        <a href="main-list.html" class="li-item__link" aria-label="Link that redirects to the main anime list" id="mainList">Anime Openings Main List</a>
                    </li> 
            </ul> 
        </nav>
                <div class="header__language">
            <select name="" id="language">
                <option value="EN">EN</option>
                <option value="ES">ES</option>
            </select>
        </div>
    </header>
    <div class="container">
        <main class="container__list-container">
            <ol class="list-container__list">
                <li class="list-container__li-container">
                    <div class="li-container__li-thumbnail" id="li-container__li-thumbnail-osnkop1">
                        <a href="https://www.youtube.com/watch?v=PgBvV9ofjmA&pp=ygUNb3NoaSBubyBrbyBvcA%3D%3D" target="_blank" rel="noopener noreferrer nofollow" aria-label="Link that opens a new tab to Oshi No Ko Opening 1" class="li-thumbnail__link"></a>
                    </div>
                    <div class="li-container__text">
                        <h2>#1- Oshi No Ko Opening 1 
                        </h2>
                    </div>
                </li>
            </ol>
        </main>
        <aside class="container__aside">
            <button class="aside__button">
                <a href="" id="aside__button-list" aria-label="Button that adds a new video">Add</a>
            </button>
        </aside>
    </div>
    <footer class="footer"></footer>
    <script src="main-list.js"></script>
    <script src="changeLanguage.js"></script>
</body>
</html>
